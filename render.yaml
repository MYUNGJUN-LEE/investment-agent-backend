services:
  - type: web
    name: investment-agent-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ACTION_SCHEMA_PUBLIC_URL
        value: "https://api.autoinvestmentkorea.online"
      - key: EMBEDDED_WORKERS_ENABLED
        value: "true"
      - key: EMBEDDED_WORKER_BROKER_SYNC_ENABLED
        value: "true"
      - key: MARKET_MONITOR_ENABLED
        value: "true"
      - key: AUTO_TRADING_WORKER_POLL_SECONDS
        value: "2"
      - key: AUTO_TRADING_WORKER_LOCK_SECONDS
        value: "7200"
      - key: AUTO_TRADING_SYMBOL_WORKERS
        value: "1"
      - key: AUTO_TRADING_MAX_OPEN_POSITIONS
        value: "5"
      - key: AUTO_TRADING_ONE_SESSION_PER_ACCOUNT
        value: "true"
      - key: TRADE_ORCHESTRATOR_ENABLED
        value: "true"
      - key: TRADE_ORCHESTRATOR_INTERVAL_SECONDS
        value: "60"
      - key: TRADE_ORCHESTRATOR_EXECUTE_ENTRIES
        value: "true"
      - key: LIVE_EXIT_CONFIRM_BEFORE_ENTRY
        value: "true"
      - key: EDGE_CALIBRATION_ENABLED
        value: "true"
      - key: EDGE_CALIBRATION_INTERVAL_SECONDS
        value: "3600"
      - key: EDGE_CALIBRATION_HORIZON_SECONDS
        value: "86400"
      - key: EDGE_CALIBRATION_MAX_SAMPLES
        value: "1000"
      - key: EDGE_CALIBRATION_MIN_SAMPLES
        value: "30"
      - key: EDGE_CALIBRATION_FUTURE_PRICE_LIMIT
        value: "96"
      - key: EDGE_CALIBRATION_RIDGE_LAMBDA
        value: "10"
      - key: EDGE_CALIBRATION_BLEND
        value: "0.35"
      - key: EDGE_CALIBRATION_TARGET_SAMPLES
        value: "1000"
      - key: EDGE_CALIBRATION_SAMPLE_RETENTION_LIMIT
        value: "10000"
      - key: EDGE_CALIBRATION_GATE_MIN_SAMPLES
        value: "1000"
      - key: EDGE_CALIBRATION_GATE_MIN_OOS_SAMPLES
        value: "200"
      - key: EDGE_CALIBRATION_GATE_MAX_MAE_RETURN_BPS
        value: "180"
      - key: EDGE_CALIBRATION_GATE_MAX_MAE_RISK_BPS
        value: "180"
      - key: EDGE_CALIBRATION_GATE_MIN_TOP10_AVG_RETURN_BPS
        value: "20"
      - key: EDGE_CALIBRATION_GATE_MIN_TOP10_WIN_RATE
        value: "0.52"
      - key: EDGE_CALIBRATION_GATE_MIN_FILL_ADJUSTED_EDGE_BPS
        value: "30"
      - key: MONITOR_PRICE_INTERVAL_SECONDS
        value: "60"
      - key: MONITOR_DISCLOSURE_INTERVAL_SECONDS
        value: "300"
      - key: MONITOR_NEWS_INTERVAL_SECONDS
        value: "600"
      - key: BROKER_SYNC_INTERVAL_SECONDS
        value: "60"
      - key: BROKER_SYNC_CONFIG_ERROR_BACKOFF_SECONDS
        value: "900"
      - key: KIS_TOKEN_CACHE_PATH
        value: "data/kis_token_cache.json"
      - key: KIS_TOKEN_ISSUE_COOLDOWN_SECONDS
        value: "70"
      - key: KIS_REQUEST_MIN_INTERVAL_SECONDS
        value: "1.5"
      - key: DYNAMIC_RISK_LIMITS_ENABLED
        value: "true"
      - key: DYNAMIC_RISK_MIN_MULTIPLIER
        value: "0.35"
      - key: DYNAMIC_RISK_MAX_MULTIPLIER
        value: "1.15"
      - key: DYNAMIC_RISK_HIGH_ATR_PCT
        value: "0.06"
      - key: DYNAMIC_RISK_LOW_ATR_PCT
        value: "0.025"
      - key: DYNAMIC_RISK_HIGH_CORRELATION
        value: "0.75"
      - key: DYNAMIC_RISK_BEAR_MULTIPLIER
        value: "0.6"
      - key: DYNAMIC_RISK_BULL_MULTIPLIER
        value: "1.05"
      - key: DYNAMIC_RISK_UNKNOWN_MULTIPLIER
        value: "1.0"
      - key: UNIVERSE_SCANNER_SYMBOL_INTERVAL_SECONDS
        value: "60"
      - key: UNIVERSE_SCANNER_MAX_SOURCE_SYMBOLS
        value: "15"
      - key: UNIVERSE_SCANNER_MIN_SCANNED_SYMBOLS_FOR_TRADING
        value: "15"
      - key: UNIVERSE_SCANNER_CANDIDATE_TTL_SECONDS
        value: "3600"
      - key: UNIVERSE_SCANNER_WORKER_HURDLE_RATE_BPS
        value: "50"
      - key: UNIVERSE_SCANNER_DEFAULT_SPREAD_BPS
        value: "5"
      - key: UNIVERSE_SCANNER_DEFAULT_SLIPPAGE_BPS
        value: "10"
