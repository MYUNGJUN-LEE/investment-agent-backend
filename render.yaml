services:
  - type: web
    name: investment-agent-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: EMBEDDED_WORKERS_ENABLED
        value: "true"
      - key: EMBEDDED_WORKER_BROKER_SYNC_ENABLED
        value: "true"
      - key: MARKET_MONITOR_ENABLED
        value: "true"
      - key: AUTO_TRADING_WORKER_POLL_SECONDS
        value: "2"
      - key: AUTO_TRADING_WORKER_LOCK_SECONDS
        value: "7200"
      - key: AUTO_TRADING_SYMBOL_WORKERS
        value: "1"
      - key: MONITOR_PRICE_INTERVAL_SECONDS
        value: "60"
      - key: MONITOR_DISCLOSURE_INTERVAL_SECONDS
        value: "300"
      - key: MONITOR_NEWS_INTERVAL_SECONDS
        value: "600"
      - key: BROKER_SYNC_INTERVAL_SECONDS
        value: "60"
      - key: BROKER_SYNC_CONFIG_ERROR_BACKOFF_SECONDS
        value: "900"
      - key: KIS_TOKEN_CACHE_PATH
        value: "data/kis_token_cache.json"
      - key: KIS_TOKEN_ISSUE_COOLDOWN_SECONDS
        value: "70"
      - key: KIS_REQUEST_MIN_INTERVAL_SECONDS
        value: "1.5"
      - key: UNIVERSE_SCANNER_SYMBOL_INTERVAL_SECONDS
        value: "60"
      - key: UNIVERSE_SCANNER_MIN_SCANNED_SYMBOLS_FOR_TRADING
        value: "15"
