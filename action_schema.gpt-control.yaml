openapi: 3.1.0
info:
  title: Investment Auto Trading GPT Control API
  version: 1.0.3
  description: GPT-safe API for checking and controlling the auto-trading backend.
servers:
  - url: https://api.autoinvestmentkorea.online

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    GenericJsonResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        message:
          type: string
    EmptyJsonRequest:
      type: object
      additionalProperties: true
      properties: {}
    AutoTradingControlRequest:
      type: object
      additionalProperties: true
      required:
        - command
      properties:
        command:
          type: string
          enum:
            - start
            - stop
            - status
        execution_mode:
          type: string
          enum:
            - paper
            - live
          default: paper
        force_new:
          type: boolean
          default: false
        interval_seconds:
          type: integer
          default: 60
        max_cycles:
          type: integer
        auto_discover_symbols:
          type: boolean
          default: true
        universe_seed_symbols:
          type: array
          items:
            type: string
        universe_candidate_limit:
          type: integer
          default: 20
        universe_final_limit:
          type: integer
          default: 10
        auto_confirm_paper:
          type: boolean
          default: true
        account_equity:
          type: number
          default: 10000000
        risk_per_trade:
          type: number
          default: 0.005
        cash_available:
          type: number
        live_confirm_token:
          type: string
    StartPaperRequest:
      type: object
      additionalProperties: true
      properties:
        force_new:
          type: boolean
          default: false
        interval_seconds:
          type: integer
          default: 60
        max_cycles:
          type: integer
        auto_discover_symbols:
          type: boolean
          default: true
        universe_seed_symbols:
          type: array
          items:
            type: string
        universe_candidate_limit:
          type: integer
          default: 20
        universe_final_limit:
          type: integer
          default: 10
        auto_confirm_paper:
          type: boolean
          default: true
        account_equity:
          type: number
          default: 10000000
        risk_per_trade:
          type: number
          default: 0.005
        cash_available:
          type: number

security:
  - ApiKeyAuth: []

paths:
  /gpt/health:
    post:
      operationId: healthCheck
      summary: Check backend health.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyJsonRequest"
      responses:
        "200":
          description: Backend health status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJsonResponse"

  /gpt/auto-trading/start-paper:
    post:
      operationId: startGptPaperAutoTrading
      summary: Start paper auto-trading.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPaperRequest"
      responses:
        "200":
          description: Paper auto-trading start result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJsonResponse"

  /gpt/auto-trading/status:
    get:
      operationId: getGptAutoTradingStatus
      summary: Check auto-trading status.
      responses:
        "200":
          description: Auto-trading status result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJsonResponse"

  /gpt/auto-trading/control:
    post:
      operationId: controlAutoTradingFromGpt
      summary: Start, stop, or check auto-trading.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoTradingControlRequest"
      responses:
        "200":
          description: Auto-trading control result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJsonResponse"

  /gpt/workers/status:
    get:
      operationId: getGptWorkerStatus
      summary: Check embedded worker status.
      responses:
        "200":
          description: Embedded worker status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJsonResponse"

  /gpt/broker/kis/config-status:
    get:
      operationId: getGptKisConfigStatus
      summary: Inspect non-secret KIS runtime configuration.
      responses:
        "200":
          description: Non-secret KIS runtime configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJsonResponse"

  /gpt/broker/kis/paper-preflight:
    post:
      operationId: preflightGptKisPaperE2E
      summary: Validate KIS paper connectivity without placing an order.
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            default: "005930"
      responses:
        "200":
          description: KIS paper connectivity preflight result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJsonResponse"

  /gpt/broker/kis/account-probe:
    get:
      operationId: probeGptKisAccount
      summary: Probe KIS paper account access without placing an order.
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            default: "005930"
        - name: product_codes
          in: query
          required: false
          schema:
            type: string
            default: "01,00,02"
        - name: force_token_refresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: KIS account probe result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericJsonResponse"
