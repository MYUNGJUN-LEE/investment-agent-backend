openapi: 3.1.0
info:
  title: Investment Auto Trading GPT Control API
  version: 1.0.0
  description: Minimal Custom GPT action schema for checking and controlling the auto-trading backend.
servers:
  - url: https://investment-agent-backend.onrender.com

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    GenericJsonResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        message:
          type: string
        detail:
          type: string
    HealthResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        service:
          type: string
        auth_enabled:
          type: boolean
    WorkerStatusResponse:
      type: object
      additionalProperties: true
      properties:
        enabled:
          type: boolean
        count:
          type: integer
        workers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              alive:
                type: boolean
              thread_name:
                type: string
    KisConfigStatusResponse:
      type: object
      additionalProperties: true
      properties:
        base_url:
          type: string
        is_paper:
          type: boolean
        app_key_configured:
          type: boolean
        app_key_length:
          type: integer
        app_secret_configured:
          type: boolean
        app_secret_length:
          type: integer
        account_no_configured:
          type: boolean
        account_no_length:
          type: integer
        account_product_code:
          type: string
        token_cache_path:
          type: string
        token_cache_enabled:
          type: boolean
        cached_token_available:
          type: boolean
        token_issue_cooldown_until:
          type: string
          nullable: true
        enable_live_trading:
          type: boolean
        embedded_worker_broker_sync_enabled:
          type: boolean
        broker_sync_interval_seconds:
          type: integer
    KisPaperPreflightResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        symbol:
          type: string
        current_price:
          type: number
        quote_connected:
          type: boolean
        balance_connected:
          type: boolean
        executions_connected:
          type: boolean
        broker_sync:
          type: object
          additionalProperties: true
        message:
          type: string
    GptAutoTradingControlRequest:
      type: object
      required:
        - command
      properties:
        command:
          type: string
          enum:
            - start
            - stop
            - status
        session_id:
          type: string
          description: Optional session id. Usually omitted for start and status.
        symbols:
          type: array
          description: Optional manual ticker list. Omit this for automatic universe discovery.
          items:
            type: string
        execution_mode:
          type: string
          enum:
            - paper
            - live
          description: Paper mode records simulated trades. Live mode can place broker orders only when backend live trading is enabled.
        interval_seconds:
          type: integer
          default: 60
        max_cycles:
          type: integer
          description: Optional cycle limit. Omit to keep running until stopped.
        auto_discover_symbols:
          type: boolean
          default: true
        universe_seed_symbols:
          type: array
          items:
            type: string
        universe_candidate_limit:
          type: integer
          default: 20
        universe_final_limit:
          type: integer
          default: 10
        auto_confirm_paper:
          type: boolean
          default: true
        account_equity:
          type: number
          default: 10000000
          description: Default account equity used for automatic quantity sizing.
        risk_per_trade:
          type: number
          default: 0.005
          description: Default risk fraction per trade used for automatic quantity sizing.
        cash_available:
          type: number
          description: Optional cash cap used for automatic quantity sizing.
        force_new:
          type: boolean
          default: false
        live_confirm_token:
          type: string
          description: Required only when execution_mode is live.
    GptAutoTradingControlResponse:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
        command:
          type: string
        message:
          type: string
        error_type:
          type: string
          nullable: true
          description: Present when the GPT-specific endpoint converted an HTTP error into a JSON diagnostic response.
        http_status:
          type: integer
          nullable: true
          description: Original HTTP status when status is error.
        detail:
          anyOf:
            - type: string
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: "null"
        started_session:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        stopped_sessions:
          type: array
          items:
            type: object
            additionalProperties: true
        active_sessions:
          type: array
          items:
            type: object
            additionalProperties: true
        recent_sessions:
          type: array
          items:
            type: object
            additionalProperties: true
        worker_status:
          anyOf:
            - $ref: "#/components/schemas/WorkerStatusResponse"
            - type: "null"

security:
  - ApiKeyAuth: []

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check backend health.
      security: []
      responses:
        "200":
          description: Backend health status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /gpt/health:
    get:
      operationId: gptBackendHealthCheck
      summary: Check backend health using a GPT-specific path.
      security: []
      responses:
        "200":
          description: Backend health status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
    post:
      operationId: gptBackendHealthCheckPost
      summary: Check backend health using a GPT-specific POST path.
      security: []
      responses:
        "200":
          description: Backend health status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /gpt/workers/status:
    get:
      operationId: getGptWorkerStatus
      summary: Check embedded worker status through the GPT-compatible route.
      responses:
        "200":
          description: Embedded worker status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerStatusResponse"

  /gpt/broker/kis/config-status:
    get:
      operationId: getGptKisConfigStatus
      summary: Inspect non-secret KIS runtime configuration through the GPT-compatible route.
      responses:
        "200":
          description: Non-secret KIS runtime configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KisConfigStatusResponse"

  /gpt/broker/kis/paper-preflight:
    post:
      operationId: preflightGptKisPaperE2E
      summary: Validate KIS paper connectivity through the GPT-compatible route.
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
            default: "005930"
          description: Korean stock ticker used for the quote connectivity check.
      responses:
        "200":
          description: KIS paper connectivity preflight result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KisPaperPreflightResponse"

  /gpt/auto-trading/control:
    post:
      operationId: controlAutoTradingFromGpt
      summary: Start, stop, or check auto-trading.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GptAutoTradingControlRequest"
      responses:
        "200":
          description: Auto-trading control result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptAutoTradingControlResponse"

  /gpt/auto-trading/status:
    get:
      operationId: getGptAutoTradingStatus
      summary: Check auto-trading status through the GPT-compatible route.
      responses:
        "200":
          description: Auto-trading status result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptAutoTradingControlResponse"

  /gpt/auto-trading/start-paper:
    post:
      operationId: startGptPaperAutoTrading
      summary: Start paper auto-trading through the GPT-compatible route.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GptAutoTradingControlRequest"
      responses:
        "200":
          description: Paper auto-trading start result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GptAutoTradingControlResponse"
